[package]
name = "keychron_ble_battery"
version = "0.1.0"
edition = "2021"

[dependencies]
zbus = "4"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
iced = { version = "0.12", features = ["tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"